[package]
name = "mock-http"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
mock-core = { path = "../mock-core" }
mock-config = { path = "../mock-config" }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower = "0.4"
tower-http = { version = "0.6", features = ["trace", "compression-br"] }
tracing = { workspace = true }

# Additional dependencies for HTTP handling
bytes = "1"
futures-util = "0.3"
http-body = "1"
http-body-util = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
form_urlencoded = "1"
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# TLS support: serve HTTPS from a JKS keystore.
# `tls-rustls-no-provider` reuses the ring crypto provider already pulled in by
# reqwest's rustls-tls feature, avoiding an extra aws-lc-rs C build.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
# Default features disabled: the `pkcs12` feature is broken upstream (p12-keystore
# API drift) and `rand` is only needed for writing keystores, not for loading.
jks = { version = "0.3", default-features = false }
