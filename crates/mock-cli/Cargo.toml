[package]
name = "mock-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "mock-api"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
mock-config = { path = "../mock-config" }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
