[workspace]
resolver = "2"
members = [
    "crates/mock-core",
    "crates/mock-config",
    "crates/mock-http",
    "crates/mock-runtime",
    "crates/mock-cli",
    "crates/mock-wasm",
    "crates/mock-integration-tests",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
jsonptr = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
